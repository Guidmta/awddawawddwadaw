<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - Irányítópult</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* Felső sáv (Fejléc) */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            box-sizing: border-box;
            background-color: #1a1a1a;
            border-bottom: 2px solid #ff3333;
        }

        /* Bal felső logó és név */
        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-left img {
            width: 35px;
            height: auto;
        }
        .top-left span {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
        }

        /* Jobb felső üdvözlés és gombok */
        .top-right {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }
        .top-right span span {
            color: #ff3333;
            font-weight: bold;
        }
        .logout-btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.3s;
            border: 1px solid #444;
            cursor: pointer;
        }
        .logout-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Tartalom */
        .content {
            padding: 40px;
        }
        .content h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- Felső sáv -->
    <div class="top-bar">
        <div class="top-left">
            <img src="logo.png" alt="SEELMTA Logo">
            <span>SEELMTA UCP</span>
        </div>
        <div class="top-right">
            <span>Üdvözöllek, <span id="usernameDisplay">Játékos</span>!</span>
            <a href="index.html" class="logout-btn" onclick="localStorage.removeItem('seelmta_user')">Kijelentkezés</a>
        </div>
    </div>

    <!-- Irányítópult tartalma -->
    <div class="content">
        <h2>Irányítópult</h2>
        <p>Itt találod a karaktered adatait, statisztikáit és egyéb beállításait.</p>
    </div>

    <script>
        // Betölti a nevet a localStorage-ból
        const savedUser = localStorage.getItem('seelmta_user');
        if (savedUser) {
            document.getElementById('usernameDisplay').textContent = savedUser;
        }
    </script>
</body>
</html>
